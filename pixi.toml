[workspace]
name = "scagent-sdk-compute"
channels = ["conda-forge", "rapidsai", "nvidia"]
platforms = ["linux-aarch64"]

# ── Spark aarch64 (GB10 / sm_121) local override — NOT committed to main ──────
# The committed x86 pixi.toml freezes exact PyPI builds (python 3.14, torch
# 2.12.1, the rapids metapackage, tensorflow-cpu 2.10.1) that have no aarch64
# wheels. This file re-authors all three compute envs for ARM using sc-agent's
# proven GB10 recipe:
#   rapids     python 3.12; conda-forge for the compiled scientific stack
#              (prebuilt aarch64); RAPIDS from conda (cuml/cugraph/cuvs); torch
#              from the CUDA-13 wheel index; a local tiledb-vector-search stub so
#              scimilarity resolves.
#   cellbender unchanged pins — they resolve on ARM as-is.
#   diffxpy    plain `tensorflow` (has aarch64 wheels; CPU-only on ARM, which is
#              what diffxpy wants) instead of `tensorflow-cpu` (no aarch64 wheel).
#
# This workspace owns scientific compute runtimes only. The Claude SDK, terminal,
# state store, media, and web stack remain in the uv-managed agent .venv.

[feature.rapids]
channels = ["rapidsai", "conda-forge", "nvidia"]
# RAPIDS publishes overlapping package names across rapidsai, nvidia, and
# conda-forge. Pixi has no flexible-priority mode, so resolve across channels and
# freeze exact package URLs and hashes.
channel-priority = "disabled"

[feature.rapids.dependencies]
python = "3.12.*"
pip = "*"
setuptools = "*"
# Clean conda toolchain so the few PyPI packages that build native extensions on
# ARM compile against conda's Python.h + C++ compiler.
cxx-compiler = "*"
# Compiled scientific stack from conda-forge — prebuilt aarch64, mutually
# consistent. Pinning these to conda stops the PyPI resolver from back-tracking
# to ancient source-only builds on ARM.
scanpy = ">=1.12"
anndata = ">=0.12"
numpy = ">=2.2,<3"
scipy = "*"
pandas = "*"
scikit-learn = "*"
numba = "*"
h5py = "*"
leidenalg = ">=0.10"
python-igraph = ">=0.10"
scikit-misc = "*"
seaborn = ">=0.12"
umap-learn = "*"
pynndescent = "*"
zarr = ">=2.18.7,<3"
# RAPIDS + CUDA 13 (aarch64). No [system-requirements] table: pixi detects the
# GB10 driver's __cuda virtual package at solve time, exactly as sc-agent does.
cuda-version = "13.*"
cuml = "*"
cugraph = "*"
cuvs = "*"
cupy = "*"
dask = "*"

[feature.rapids.pypi-dependencies]
# torch from the CUDA-13 index (the source gpu-sandbox validated on the GB10).
torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
rapids-singlecell = "==0.15.2"        # pure-Python wheel; 0.16.x needs a CMake>=3.30 source build (sc-agent uses 0.15.2)
scvi-tools = ">=1.4,<1.5"
celltypist = "*"
cytopus = "*"
# scimilarity's annotation path (hnswlib + base tiledb) is ARM-ok; only its
# tiledb-vector-search dep has no aarch64 build, so the local stub satisfies it.
scimilarity = ">=0.4,<0.5"
tiledb-vector-search = { path = "vendor/tiledb-vector-search-stub" }

[feature.rapids.activation.env]
SCAGENT_GPU = "1"
MPLBACKEND = "Agg"
CUDA_HOME = "/usr/local/cuda"
# Preload the env's own conda cuBLAS/cuBLASLt so RAPIDS' libcublas finds its
# newer libcublasLt symbols instead of binding to pip-torch's bundled nvidia-cu13
# copy (mismatch -> rapids_singlecell import fails -> silent scanpy_cpu fallback).
LD_PRELOAD = "$CONDA_PREFIX/lib/libcublas.so.13:$CONDA_PREFIX/lib/libcublasLt.so.13"
TORCH_CUDA_ARCH_LIST = "12.1a"                 # GB10 = sm_121
TRITON_PTXAS_PATH = "/usr/local/cuda/bin/ptxas"

[feature.rapids.tasks]
check = "python scripts/validate_compute_runtime.py rapids"

[feature.cellbender.dependencies]
python = "3.10.*"
pip = "*"

[feature.cellbender.pypi-dependencies]
cellbender = "==0.3.2"

[feature.cellbender.activation.env]
MPLBACKEND = "Agg"

[feature.cellbender.tasks]
check = "python scripts/validate_compute_runtime.py cellbender"

[feature.diffxpy.dependencies]
python = "3.9.*"
pip = "*"

[feature.diffxpy.pypi-dependencies]
numpy = "==1.23.5"
scipy = "==1.9.3"
pandas = "==1.5.3"
anndata = "==0.8.0"
tensorflow = "==2.10.1"          # aarch64: tensorflow-cpu has no ARM wheel; plain tensorflow is CPU-only on ARM
diffxpy = "==0.7.4"
batchglm = "==0.7.4"
dask = "==2.30.0"
toolz = "==0.11.1"
patsy = "==0.5.6"

[feature.diffxpy.activation.env]
MPLBACKEND = "Agg"
TF_CPP_MIN_LOG_LEVEL = "3"
CUDA_VISIBLE_DEVICES = ""

[feature.diffxpy.tasks]
check = "python scripts/validate_compute_runtime.py diffxpy"

[environments]
rapids = { features = ["rapids"], no-default-feature = true }
cellbender = { features = ["cellbender"], no-default-feature = true }
diffxpy = { features = ["diffxpy"], no-default-feature = true }
