schema_version: 1
skill:
  id: single-cell-qc
  version: "0.5.0"
  description: Comprehensive flag-first QC, visual review, and explicit filtering operations.
tools:
  - name: calculate_single_cell_qc
    description: Calculate count-derived cell and gene QC metrics, add threshold flags, and save evidence without removing cells or genes.
    entrypoint: scripts/qc.py:calculate_qc
    environment: gpu-singlecell
    activity_label: Calculating single-cell QC
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string, description: H5AD containing raw counts in a layer or X.}
        counts_layer:
          type: [string, "null"]
          default: auto
          description: "'auto' uses layers['counts'] when present and otherwise validates X; null explicitly uses X."
        organism: {type: string, enum: [human, mouse], default: human}
        min_genes: {type: [integer, "null"], minimum: 0, default: 200}
        max_genes: {type: [integer, "null"], minimum: 1, default: null}
        max_pct_mito: {type: [number, "null"], minimum: 0, maximum: 100, default: 20}
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: qc-anndata
  - name: review_single_cell_qc
    description: Record a visual, evidence-bound QC decision after inspecting every standard QC figure; filtering remains a separate explicit mutation.
    entrypoint: scripts/qc.py:review_qc
    environment: current
    activity_label: Recording cell QC review
    input_schema:
      type: object
      properties:
        assessment_id: {type: string, minLength: 1}
        decision:
          type: string
          enum: [keep_all, filter_cells, request_guidance, not_applicable]
        rationale: {type: string, minLength: 1}
        visual_findings:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        reviewed_artifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
      required: [assessment_id, decision, rationale, visual_findings, reviewed_artifacts]
      additionalProperties: false
  - name: filter_single_cells
    description: Apply explicit detected-gene and mitochondrial thresholds to a count-bearing H5AD, saving a new artifact and cell-set identity.
    entrypoint: scripts/qc.py:filter_cells
    environment: gpu-singlecell
    activity_label: Filtering single cells
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        counts_layer:
          type: [string, "null"]
          default: auto
          description: "'auto' uses layers['counts'] when present and otherwise validates X; null explicitly uses X."
        organism: {type: string, enum: [human, mouse], default: human}
        min_genes: {type: [integer, "null"], minimum: 0, default: 200}
        max_genes: {type: [integer, "null"], minimum: 1, default: null}
        max_pct_mito: {type: [number, "null"], minimum: 0, maximum: 100, default: 20}
        confirm_filtering: {type: boolean, description: Explicit confirmation that this operation changes the cell set.}
      required: [confirm_filtering]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: qc-anndata
  - name: filter_single_cell_genes
    description: Remove low-detection genes (a dataset-size-aware threshold by default) and, by default, ribosomal genes; keep mitochondrial genes. Per-cell mitochondrial/ribosomal percentages are computed before removal and preserved in obs.
    entrypoint: scripts/qc.py:filter_genes
    environment: gpu-singlecell
    activity_label: Filtering single-cell genes
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        counts_layer:
          type: [string, "null"]
          default: auto
          description: "'auto' uses layers['counts'] when present and otherwise validates X; null explicitly uses X."
        organism: {type: string, enum: [human, mouse], default: human, description: Used only to detect mitochondrial gene symbols when computing preserved QC percentages.}
        min_cells:
          type: [integer, "null"]
          minimum: 1
          default: null
          description: Absolute minimum cells a gene must be detected in. Overrides the dataset-size fraction when set; leave unset to use min_cell_fraction capped at max_cells.
        min_cell_fraction:
          type: number
          minimum: 0
          maximum: 1
          default: 0.02
          description: "Keep genes detected in at least this fraction of cells (default 0.02 = 2%), capped at max_cells. Set 0 to disable the low-detection filter (e.g. strict source replication)."
        max_cells:
          type: integer
          minimum: 0
          default: 100
          description: Absolute cap on the fraction-derived threshold so large datasets do not delete rare-cell-type markers. 2% governs small datasets; this cap takes over on large ones.
        remove_ribosomal: {type: boolean, default: true, description: "Remove ribosomal genes (RPS/RPL and mitochondrial-ribosomal MRPS/MRPL) so they cannot drive embedding or marker interpretation. pct_counts_ribo is preserved in obs. Set false to keep them in the matrix."}
        remove_mitochondrial: {type: boolean, default: false, description: "Remove mitochondrial (MT-) genes from the matrix. Off by default: mitochondrial content stays a cell-level QC concern (max_pct_mito) rather than a feature removal."}
        confirm_filtering: {type: boolean, description: Explicit confirmation that this operation changes the feature set.}
      required: [confirm_filtering]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: gene-filtered-anndata
