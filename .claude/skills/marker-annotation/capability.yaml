schema_version: 1
skill:
  id: marker-annotation
  version: "0.4.0"
  description: Transparent cluster DEG/marker evidence and evidence-bound annotation review.
tools:
  - name: evaluate_marker_evidence
    description: Rank genes for a supplied grouping, score broad or user-supplied marker programs, and save candidate evidence.
    entrypoint: scripts/markers.py:run
    environment: gpu-singlecell
    activity_label: Evaluating marker evidence
    input_schema:
      type: object
      properties:
        path: {type: string, description: Prepared H5AD path.}
        cluster_key: {type: string, default: leiden}
        organism: {type: string, enum: [human, mouse], default: human}
        top_n: {type: integer, minimum: 5, maximum: 100, default: 30}
        min_logfoldchange: {type: number, default: 0.25}
        max_adjusted_pvalue: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
        min_marker_overlap: {type: integer, minimum: 1, default: 2}
        use_cytopus:
          type: boolean
          default: true
          description: Augment built-in human marker programs from the curated Cytopus knowledge base when available.
        marker_sets:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
      additionalProperties: false
    primary_matrix_input: path
  - name: review_annotation_evidence
    description: Record DEG-primary adjudication after inspecting current DEG and reference evidence, requiring two independent references when available or a documented waiver.
    entrypoint: scripts/markers.py:review_annotation_evidence
    environment: current
    activity_label: Reviewing annotation evidence
    input_schema:
      type: object
      properties:
        methods_reviewed:
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, minLength: 1}
        reviewed_artifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        agreement_findings:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        unresolved_clusters:
          type: array
          uniqueItems: true
          default: []
          items: {type: string, minLength: 1}
        reference_waiver:
          type: [string, "null"]
          default: null
          description: Required when fewer than two independent reference methods are current.
        rationale: {type: string, minLength: 1}
      required: [methods_reviewed, reviewed_artifacts, agreement_findings,
                 unresolved_clusters, rationale]
      additionalProperties: false
