schema_version: 1
skill:
  id: dimensionality-reduction
  version: "0.1.0"
  description: Independent PCA, neighbor-graph, and UMAP transformations.
tools:
  - name: compute_single_cell_pca
    description: Compute PCA from the current expression matrix, optionally using an existing highly-variable-gene mask.
    entrypoint: scripts/reduce.py:compute_pca
    environment: gpu-singlecell
    activity_label: Computing PCA
    input_schema:
      type: object
      properties:
        path: {type: string}
        n_components: {type: integer, minimum: 2, maximum: 200, default: 50}
        use_highly_variable: {type: boolean, default: true}
        random_seed: {type: integer, default: 0}
      required: [path]
      additionalProperties: false
  - name: build_single_cell_neighbors
    description: Build a nearest-neighbor graph from an explicitly named representation such as X_pca, X_scVI, or X_scimilarity.
    entrypoint: scripts/reduce.py:build_neighbors
    environment: gpu-singlecell
    activity_label: Building neighbors
    input_schema:
      type: object
      properties:
        path: {type: string}
        representation_key: {type: string, default: X_pca}
        neighbors_key: {type: string, default: neighbors}
        n_neighbors: {type: integer, minimum: 2, default: 15}
        n_pcs: {type: [integer, "null"], minimum: 2, default: null}
        random_seed: {type: integer, default: 0}
      required: [path]
      additionalProperties: false
  - name: compute_single_cell_umap
    description: Compute a UMAP visualization from an existing neighbor graph.
    entrypoint: scripts/reduce.py:compute_umap
    environment: gpu-singlecell
    activity_label: Computing UMAP
    input_schema:
      type: object
      properties:
        path: {type: string}
        neighbors_key: {type: string, default: neighbors}
        umap_key: {type: string, default: X_umap}
        min_dist: {type: number, minimum: 0, maximum: 1, default: 0.5}
        spread: {type: number, exclusiveMinimum: 0, default: 1.0}
        random_seed: {type: integer, default: 0}
      required: [path]
      additionalProperties: false
