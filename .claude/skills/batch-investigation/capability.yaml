schema_version: 1
skill:
  id: batch-investigation
  version: "0.9.0"
  description: Gene-first matched-population batch evidence followed by a user-owned, identity-bound handling decision.
tools:
  - name: investigate_batch
    description: Produce a five-table gene-first evidence packet — sample-enriched regions, within-sample identity DEGs, cross-sample population matches, direct matched comparisons, and design confounding — plus SDK state artifacts. Records no decision.
    entrypoint: scripts/investigate.py:run_evidence
    environment: gpu-singlecell
    activity_label: Investigating batch evidence
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Any H5AD with expression values, cluster labels, and a meaningful batch column when batch_key is non-null.
        batch_key:
          type: [string, "null"]
          description: Observation column for a meaningful batch unit; null records not_applicable.
        cluster_key: {type: string, default: leiden}
        condition_keys:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
          default: []
          description: Design/condition columns to cross-tab against the batch key for confounding.
        technical_batch_documented:
          type: boolean
          default: false
          description: Only true when metadata/documentation establishes a technical batch.
        technical_batch_basis: {type: [string, "null"], default: null}
        min_cells_per_region: {type: integer, minimum: 10, default: 30}
        min_enrichment: {type: number, minimum: 1, default: 2.0}
        n_identity_genes: {type: integer, minimum: 5, maximum: 100, default: 50}
        max_regions: {type: integer, minimum: 1, maximum: 200, default: 40}
        max_candidate_pairs:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: Maximum confirmed cross-sample population pairs receiving direct DE, matching the compact original investigation.
        max_pair_attempts:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Maximum profile-nominated candidate pairs checked for identity-DEG overlap.
        min_profile_correlation:
          type: number
          minimum: -1
          maximum: 1
          default: 0.4
          description: Minimum mean-expression correlation for cross-sample pair nomination.
        min_shared_identity_genes:
          type: integer
          minimum: 1
          default: 5
          description: Minimum shared top-25 DISCRIMINATING identity genes for a supported cross-sample match.
        min_match_jaccard:
          type: number
          minimum: 0
          maximum: 1
          default: 0.15
          description: Minimum discriminating-gene Jaccard for a supported match.
        min_fraction_difference: {type: number, minimum: 0, maximum: 1, default: 0.1}
        min_logfoldchange: {type: number, default: 0.5}
        max_adjusted_pvalue: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
        n_neighbors_for_mixing: {type: integer, minimum: 2, maximum: 200, default: 30}
        max_cells_for_mixing: {type: integer, minimum: 100, default: 20000}
        random_seed: {type: integer, default: 0}
      required: [batch_key]
      additionalProperties: false
    primary_matrix_input: path
  - name: decide_batch_handling
    description: Record the user's explicit post-investigation batch-handling choice against current evidence. The tool captures the newest post-evidence user turn automatically; request_guidance remains pending. Integration additionally requires an explicit basis.
    entrypoint: scripts/investigate.py:run_decision
    environment: gpu-singlecell
    activity_label: Recording batch decision
    floors: [current_batch_evidence]
    input_schema:
      type: object
      properties:
        evidence_id: {type: string, minLength: 1}
        decision:
          type: string
          enum: [keep_uncorrected, integrate, separate, request_guidance, not_applicable]
        integration_basis:
          type: [string, "null"]
          enum: [documented_technical_batch, user_authorized_integration, null]
          default: null
        question_asked:
          type: [string, "null"]
          default: null
          description: >-
            The question put to the user. Required for keep_uncorrected, integrate, or separate.
            The tool finds the newest real user turn after the evidence and records its exact answer.
      required: [evidence_id, decision]
      additionalProperties: false
